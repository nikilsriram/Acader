<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acader - Study Smarter with AI</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            border: none;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        html {
            font-size: 62.5%;
            scroll-behavior: smooth;
        }

        body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #000000 !important;
            color: #ffffff;
        }

        /* HEADER & NAVIGATION */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 2rem 7%;
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .logo {
            font-size: 3rem;
            color: #b74b4b !important;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        nav a {
            font-size: 1.6rem;
            color: #ffffff !important;
            font-weight: 500;
            transition: color 0.3s ease, border-color 0.3s ease;
            border-bottom: 3px solid transparent;
            padding-bottom: 0.3rem;
            white-space: nowrap;
        }

        nav a:hover,
        nav a.active {
            color: #b74b4b !important;
            border-bottom: 3px solid #b74b4b;
        }

        /* HAMBURGER TOGGLE BUTTON */
        .menu-icon {
            display: none;
            font-size: 2.5rem;
            color: #ffffff;
            cursor: pointer;
        }

        /* MAIN HOME SECTION */
        section {
            min-height: 100vh;
            padding: 10rem 7% 5rem;
        }

        .home {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6rem;
            width: 100%;
            min-height: 100vh;
            background-color: #000000;
        }

        .home-content {
            max-width: 600px;
            width: 100%;
        }

        .home-content h1 {
            font-size: 5.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
        }

        .home-content h1 span {
            color: #b74b4b;
        }

        .home-content p {
            font-size: 1.8rem;
            line-height: 1.6;
            color: #cccccc;
            margin-top: 2rem;
            margin-bottom: 3rem;
        }

        .home-img {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home-img img {
            width: 28vw;
            max-width: 380px;
            min-width: 250px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(183, 75, 75, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .home-img img:hover {
            transform: scale(1.03);
            box-shadow: 0 0 40px rgba(183, 75, 75, 0.6);
        }

        /* TYPING EFFECT FIX */
        .typing-text {
            font-size: 3.2rem;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .typing-text span {
            color: #b74b4b;
            position: relative;
            display: inline-block;
        }

        .typing-text span::before {
            content: "tests.";
            animation: words 12s infinite;
        }

        .typing-text span::after {
            content: "";
            position: absolute;
            right: -8px;
            top: 10%;
            height: 80%;
            width: 2px;
            background-color: #b74b4b;
            animation: cursor 0.8s infinite;
        }

        @keyframes cursor {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes words {
            0%, 30% {
                content: "tests.";
            }
            33%, 63% {
                content: "flashcards.";
            }
            66%, 96% {
                content: "study guides.";
            }
        }

        /* CALL TO ACTION BUTTON */
        .btn {
            display: inline-block;
            padding: 1.2rem 3.2rem;
            background-color: transparent;
            border-radius: 4rem;
            font-size: 1.6rem;
            color: #b74b4b;
            letter-spacing: 0.2rem;
            font-weight: 600;
            border: 2px solid #b74b4b;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: center;
        }

        .btn:hover {
            background-color: #b74b4b;
            color: #000000;
            box-shadow: 0 0 20px rgba(183, 75, 75, 0.6);
            transform: translateY(-2px);
        }

        /* RESPONSIVE MEDIA QUERIES */

        /* Tablet View (max-width: 992px) */
        @media screen and (max-width: 992px) {
            html {
                font-size: 56.25%; /* 1rem = 9px */
            }

            .home {
                gap: 4rem;
            }

            .home-content h1 {
                font-size: 4.8rem;
            }

            .typing-text {
                font-size: 2.8rem;
            }
        }

        /* Mobile View (max-width: 768px) */
        @media screen and (max-width: 768px) {
            header {
                padding: 1.5rem 5%;
            }

            .menu-icon {
                display: block;
            }

            nav {
                position: fixed;
                top: 0;
                right: -100%;
                width: 70%;
                height: 100vh;
                background-color: #121212;
                border-left: 2px solid #b74b4b;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 3rem;
                transition: right 0.4s ease;
                z-index: 999;
            }

            nav.active {
                right: 0;
            }

            nav a {
                font-size: 2rem;
            }

            .home {
                flex-direction: column-reverse;
                justify-content: center;
                text-align: center;
                padding-top: 12rem;
                gap: 3rem;
            }

            .home-content {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .home-img img {
                width: 60vw;
                max-width: 280px;
            }

            .typing-text {
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="#" class="logo">Acader</a>

        <div class="menu-icon" id="menu-icon">
            <i class="fa-solid fa-bars"></i>
        </div>

        <nav id="navbar">
            <a href="/" class="active">Home</a>
            <a href="/aboutme">About Us</a>
            <a href="/faq">FAQ</a>
            <a href="/contact">Contact Us</a>
            <a href="/login">Login/Sign Up</a>
        </nav>
    </header>

    <section class="home">

        <div class="home-content">
            <h1>Welcome to <span>Acader</span></h1>

            <div class="typing-text">
                Study smarter with <span></span>
            </div>

            <p>
                Turn your notes into interactive tests, flashcards, 
                and comprehensive review guides in seconds.
            </p>

            <a href="/login" class="btn">Try For Free</a>
        </div>

        <div class="home-img">
            <img src="./gem.jpeg" alt="Acader Platform Preview">
        </div>

    </section>

    <script>
        // Toggle Mobile Menu
        const menuIcon = document.getElementById('menu-icon');
        const navbar = document.getElementById('navbar');

        menuIcon.addEventListener('click', () => {
            navbar.classList.toggle('active');
            const icon = menuIcon.querySelector('i');
            if (navbar.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        });

        // Close navbar when clicking a link (mobile)
        document.querySelectorAll('nav a').forEach(link => {
            link.addEventListener('click', () => {
                navbar.classList.remove('active');
                const icon = menuIcon.querySelector('i');
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            });
        });
    </script>

</body>

</html>
