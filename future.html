<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #222;
            color: #fff;
            font-family: 'sans-serif'
        }

        .testimonials {
            padding: 0 60px;
            margin: 50px auto;
            width: 1300px;
        }

        .testimonials h1 {
            font-size: 40px;
            font-weight: 700;
            text-align: center;
            position: relative;
            margin-bottom: 60px;
            padding-bottom: 15px;
        }

        .testimonials h1::after {
            content: '';
            position: absolute;
            height: 3px;
            width: 170px;
            background-color: #fff;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .content {
            display: flex;
            justify-content: space-between;
            text-align: center;
            margin-top: 100px;
        }

        .card {
            background: #333;
            padding: 60px 26px 20px;
            width: calc(34% - 20px);
            text-align: center;
            user-select: none;
            cursor: pointer;
            border-radius: 6px;
            border: 2px solid #222;
        }

        .image {
            position: absolute;
            top: 150px;
            margin-left: 100px;
        }

        .image img {
            width: 120px;
            border-radius: 50%;
            border: 5px solid #222;
            transition: all 0.3s ease;
        }

        .box h3 {
            font-size: 25px;
            margin: 5px 0;
        }

        .box h3 span {
            font-size: 12px;
            font-weight: normals;
        }

        .box p {
            font-size: 18px; 
        }

        .box p i {
            color:crimson;
        }

        .card:hover {
            border:2px solid #fff;
        }

        .card:hover .image img {
            border: 2px solid #fff;
        }
    </style>
</head>
<body>
    <div class="testimonials">
        <h1>Testimonials</h1>
        <div class="content">
            <div class="card">
                <div class="box">
                    <div class="image">
                        <img src="img" >
                    </div>
                    <h3>Name <span>CEO at XYZ</span></h3>
                    <p><i class="fa fa-quote-left">asdfasdfasdf</i></p>
                </div>
            </div>

            <div class="card">
                <div class="box">
                    <div class="image">
                        <img src="img" >
                    </div>
                    <h3>Name <span>CEO at XYZ</span></h3>
                    <p><i class="fa fa-quote-left">asdfasdfasdf</i></p>
                </div>
            </div>

            <div class="card">
                <div class="box">
                    <div class="image">
                        <img src="img" >
                    </div>
                    <h3>Name <span>CEO at XYZ</span></h3>
                    <p><i class="fa fa-quote-left">asdfasdfasdf</i></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
